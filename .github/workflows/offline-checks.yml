# 离线门禁：不需要 TIA Portal，也不需要构建产物。
#
# 只放"在干净检出上就能跑"的检查。两类需要环境、因此暂不在这里跑的检查：
#   * dotnet 测试：本仓的 TiaMcpServer.Tests 是 xunit + 对主工程的 ProjectReference，
#     需要 Siemens Openness 程序集，托管 runner 上编不动。要进 CI 得先做成
#     "零依赖控制台 Exe"（上游做法）—— 见 A2。
#   * Validate-Bundle.ps1：它会检查 bin\Release\net48\TiaMcpServer.exe 是否存在，
#     而干净检出没有 bin\。要进 CI 得先在 CI 里构建，或让它接受 runtime\ 里的引擎。
#   * scripts/Smoke-ConnectIsolated.py：它会**真的拉起一个 TIA Portal 进程**，只能在装了 TIA
#     的机器上由人手动跑（验的是 ConnectIsolated 的"隔离"这条安全属性，不是构建正确性）。
#     别把它放进 CI，也别无人值守地跑它 —— 用法与安全纪律见脚本头部。
#
# 每个 job 都跑一次自检（--selftest）：凡是"检查自己坏了却全绿"的地方，
# 都要能证明它抓得住问题。
name: offline-checks

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

# 本仓的闸门脚本会输出中文。Windows runner 上 Python 的 stdout 默认是 cp1252，
# 打印中文会 UnicodeEncodeError 把闸门自己弄崩（表现为"检查失败"，其实一行都没检查）。
# 脚本内部各自 reconfigure 了 stdout；这里再兜一层，覆盖以后新增的脚本。
env:
  PYTHONUTF8: '1'

jobs:
  dead-tool-references:
    name: dead tool references
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: descriptions may only name registered tools
        run: python scripts/Check-DeadToolReferences.py
      - name: sentinel — the gate must be able to fail
        run: python scripts/Check-DeadToolReferences.py --selftest

  manifest-consistency:
    name: manifest consistency
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: tools-list.json and package-manifest.json must agree
        run: python scripts/Check-ManifestConsistency.py
      - name: fault-injection self-check
        run: python scripts/Check-ManifestConsistency.py --selftest

  offline-tests:
    name: offline tests (no TIA required)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # 用 dotnet run，**不要**改成 dotnet test：控制台 Exe 上它只会还原、一个用例都不跑、
      # 然后退 0 —— 一个和「全部通过」长得一模一样的假绿灯。套件内部先跑断言器自检。
      - name: zero-dependency suite (EngineRouter / LadTextRenderer)
        run: dotnet run --project tools/tiaportal-mcp/tests/TiaMcpServer.OfflineChecks/TiaMcpServer.OfflineChecks.csproj -c Release

  version-consistency:
    name: version consistency
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 本仓**没有** CHANGELOG.md（有意不维护），所以只比对 csproj 与 package-manifest。
      - name: csproj AssemblyVersion vs package-manifest
        run: python scripts/Check-VersionConsistency.py
      - name: fault-injection self-check
        run: python scripts/Check-VersionConsistency.py --selftest

  # 发布闸（**手动触发**，非每次 push）：
  # Check-LiteProfile 需要一个**能跑起来的引擎 exe** 才能探测档位，而干净 runner 上没有构建产物；
  # 仓里自带的 runtime\v21\TiaMcpServer.exe 在无 TIA 的环境里启动就会因程序集解析失败（找不到
  # Siemens.Engineering.Base）—— 实测如此。所以这里先在 runner 上构建引擎再跑；
  # 若某天确认引擎无法在无 TIA 的 runner 上构建，就把它挪到本地/发布流程里跑。
  lite-profile:
    name: release gate (lite profile + response parking)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: build engine (V20 target)
        run: dotnet build tools/tiaportal-mcp/src/TiaMcpServer/TiaMcpServer.V20.csproj -c Release -p:BaseIntermediateOutputPath=obj-ci-v20/ -p:BaseOutputPath=bin-ci-v20/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: lite must cover the golden path and stay under the host cap
        run: python scripts/Check-LiteProfile.py tools/tiaportal-mcp/src/TiaMcpServer/bin-ci-v20/Release/net48/TiaMcpServer.exe
      # 离线套件只盯得住 ExportStore 的**逻辑**；"接线有没有真的被调用"只有端到端才知道。
      # 编译通过 + 工具注册上了 + 逻辑单测全绿，曾经给人一种"验过了"的假象。
      - name: large-response parking must really engage end to end
        run: python scripts/Smoke-ResponseParking.py tools/tiaportal-mcp/src/TiaMcpServer/bin-ci-v20/Release/net48/TiaMcpServer.exe
      # 同理：ArgDiagnostics 的判定有 24 条离线用例，但"这层有没有真的被调用"只有端到端才知道。
      # 两个方向都要验：错的必须被拦且说清原因，对的绝不能被拦。
      - name: argument diagnostics must really engage end to end
        run: python scripts/Smoke-ArgDiagnostics.py tools/tiaportal-mcp/src/TiaMcpServer/bin-ci-v20/Release/net48/TiaMcpServer.exe
